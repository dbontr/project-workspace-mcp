name: Kubernetes distribution

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  helm-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@v4
      - name: Build controller and worker runtime images
        run: |
          docker buildx build --platform linux/amd64 --provenance=false --load \
            -f deploy/kubernetes/Dockerfile.controller -t pwm-controller:ci .
          docker buildx build --platform linux/amd64 --provenance=false --load \
            -f deploy/kubernetes/Dockerfile.worker -t pwm-worker:ci .
          docker run --rm --entrypoint restic pwm-controller:ci version
      - name: Start disposable Kubernetes cluster
        uses: helm/kind-action@v1.12.0
        with:
          version: v0.30.0
          node_image: kindest/node:v1.34.0
          kubectl_version: v1.34.1
      - name: Validate Restic Helm configuration
        run: |
          helm template pwm-controller deploy/helm/project-workspace \
            --set worker.enabled=false \
            --set controller.backupInterval=24h \
            --set controller.offsite.repository=s3:backup.example.invalid/tenant \
            --set controller.offsite.passwordSecretName=pwm-restic-password \
            --set controller.offsite.backendSecretName=pwm-restic-backend > /tmp/restic-helm.yaml
          grep -q 'PWM_RESTIC_PASSWORD_FILE' /tmp/restic-helm.yaml
          grep -q 'name: restic-password' /tmp/restic-helm.yaml
          grep -q 'name: restic-password-input' /tmp/restic-helm.yaml
          if helm template pwm-controller deploy/helm/project-workspace --set worker.enabled=false \
             --set controller.backupInterval=24h >/tmp/restic-missing.yaml 2>/tmp/restic-error; then
            echo "Backup chart accepted missing repository credentials" >&2
            exit 1
          fi
          grep -q 'encrypted backups require' /tmp/restic-error
      - name: Keep default installation controller-only
        run: |
          helm template pwm-controller deploy/helm/project-workspace > /tmp/default-install.yaml
          grep -q 'kind: Deployment' /tmp/default-install.yaml
          grep -q 'name: pwm-controller' /tmp/default-install.yaml
          if grep -q 'name: pwm-worker-research' /tmp/default-install.yaml; then
            echo "Worker deployed without explicit enrollment" >&2
            exit 1
          fi
          if grep -q 'kind: Namespace' /tmp/default-install.yaml; then
            echo "Default chart created a workload namespace" >&2
            exit 1
          fi
      - name: Reject unsafe worker namespaces and identities
        run: |
          for namespace in pwm-system default kube-system kube-public kube-node-lease invalid.; do
            if helm template pwm-research deploy/helm/project-workspace \
               --namespace pwm-system \
               --set controller.enabled=false --set worker.enabled=true \
               --set worker.workloadNamespace="$namespace" > /tmp/unsafe-worker.yaml 2>/tmp/unsafe-worker.err; then
              echo "Chart accepted unsafe worker namespace $namespace" >&2
              exit 1
            fi
          done
          if helm template pwm-research deploy/helm/project-workspace \
             --namespace pwm-system \
             --set controller.enabled=false --set worker.enabled=true \
             --set worker.projectID="$(printf '%060d' 1)" > /tmp/unsafe-worker.yaml 2>/tmp/unsafe-worker.err; then
            echo "Chart accepted a worker identity that exceeds Kubernetes name limits" >&2
            exit 1
          fi
      - name: Validate controller node placement
        run: |
          cat > /tmp/controller-placement-values.yaml <<'EOF'
          controller:
            nodeSelector:
              kubernetes.io/hostname: control-host
          worker:
            enabled: false
          EOF
          helm template pwm-controller deploy/helm/project-workspace \
            -f /tmp/controller-placement-values.yaml > /tmp/controller-placement.yaml
          grep -A2 'nodeSelector:' /tmp/controller-placement.yaml | grep -q 'kubernetes.io/hostname: control-host'
          helm template pwm-controller deploy/helm/project-workspace \
            --set worker.enabled=false > /tmp/controller-default.yaml
          if grep -q 'nodeSelector:' /tmp/controller-default.yaml; then
            echo "Unexpected controller node selector in default chart" >&2
            exit 1
          fi
      - name: Validate restricted worker deployment placement
        run: |
          cat > /tmp/worker-placement-values.yaml <<'EOF'
          controller:
            enabled: false
          worker:
            enabled: true
            nodeSelector:
              kubernetes.io/hostname: compute-worker
          EOF
          helm template pwm-research deploy/helm/project-workspace \
            -f /tmp/worker-placement-values.yaml > /tmp/worker-placement.yaml
          grep -A2 'nodeSelector:' /tmp/worker-placement.yaml | grep -q 'kubernetes.io/hostname: compute-worker'
          helm template pwm-research deploy/helm/project-workspace \
            --set controller.enabled=false --set worker.enabled=true > /tmp/worker-default.yaml
          if grep -q 'nodeSelector:' /tmp/worker-default.yaml; then
            echo 'Unexpected worker nodeSelector without an explicit choice' >&2
            exit 1
          fi
      - name: Load packaged application images
        run: |
          kind load docker-image pwm-controller:ci --name chart-testing
          kind load docker-image pwm-worker:ci --name chart-testing
      - name: Verify Helm deployment and paired workspace lifecycle
        run: bash scripts/ci-kubernetes-smoke.sh
      - name: Verify encrypted network backup and clean PVC recovery
        run: bash scripts/ci-kubernetes-backup.sh

  publish:
    needs: helm-smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Authenticate to GitHub Container Registry
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish controller and worker images
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          for component in controller worker; do
            image="ghcr.io/$owner/project-workspace-$component"
            docker buildx build --platform linux/amd64 --provenance=false --load \
              -f "deploy/kubernetes/Dockerfile.$component" \
              -t "$image:main" -t "$image:$GITHUB_SHA" .
            docker push "$image:$GITHUB_SHA"
            docker push "$image:main"
          done
