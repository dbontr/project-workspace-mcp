name: Python checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Run tests
        run: python -m pytest -q
      - name: Check source syntax
        run: python -m compileall -q src

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build Go worker
        run: go build -o ./project-workspace-worker ./cmd/project-workspace-worker
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Run Linux Docker integration
        env:
          RUN_DOCKER_INTEGRATION: "1"
          RUN_GO_INTEGRATION: "1"
          PWM_GO_WORKER: "${{ github.workspace }}/project-workspace-worker"
        run: |
          docker pull python:3.12-slim
          python -m pytest -q tests/test_docker_integration.py tests/test_go_worker_e2e.py

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Test and vet Go worker
        run: |
          go test ./...
          go vet ./...
          GOOS=linux GOARCH=amd64 go build ./cmd/project-workspace-worker
          GOOS=linux GOARCH=arm64 go build ./cmd/project-workspace-worker
