name: Go verification
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Go tests
        run: go test -count=1 ./...
      - name: Race tests
        run: go test -race -count=1 ./internal/controller ./internal/worker
      - name: Backup command formatting
        run: |
          gofmt -d internal/controller/backup.go internal/controller/backup_test.go cmd/project-workspace-controller/main.go
          test -z "$(gofmt -l internal/controller/backup.go internal/controller/backup_test.go cmd/project-workspace-controller/main.go)"
      - name: Format new Go components
        run: |
          gofmt -d internal/controller/software_pool.go internal/controller/software_pool_http.go internal/controller/software_pool_test.go internal/controller/artifact_transfer.go
          test -z "$(gofmt -l internal/controller/software_pool.go internal/controller/software_pool_http.go internal/controller/software_pool_test.go internal/controller/artifact_transfer.go)"
      - name: Format authentication components
        run: |
          gofmt -d internal/controller/oidc.go internal/controller/project_grants.go internal/controller/access_control.go internal/controller/access_control_test.go internal/controller/token_revocations.go internal/controller/server.go internal/controller/mcp.go
          test -z "$(gofmt -l internal/controller/oidc.go internal/controller/project_grants.go internal/controller/access_control.go internal/controller/access_control_test.go internal/controller/token_revocations.go internal/controller/server.go internal/controller/mcp.go)"
      - name: Format task claim components
        run: |
          gofmt -d internal/controller/task_claims.go internal/controller/task_claims_http.go internal/controller/task_claims_test.go
          test -z "$(gofmt -l internal/controller/task_claims.go internal/controller/task_claims_http.go internal/controller/task_claims_test.go)"
      - name: Format GitHub App authentication
        run: |
          gofmt -d internal/controller/github_app.go internal/controller/github_app_test.go internal/controller/github.go internal/controller/repository_stream.go
          test -z "$(gofmt -l internal/controller/github_app.go internal/controller/github_app_test.go internal/controller/github.go internal/controller/repository_stream.go)"
      - name: Static analysis
        run: go vet ./...
      - name: Build native executables
        run: |
          CGO_ENABLED=1 go build -o project-workspace-controller ./cmd/project-workspace-controller
          GOOS=linux GOARCH=amd64 go build -o project-workspace-worker ./cmd/project-workspace-worker
          GOOS=linux GOARCH=arm64 go build ./cmd/project-workspace-worker
      - name: Verify no Python service files
        run: |
          test ! -d src/project_workspace
          test ! -f pyproject.toml
          if find . -type f -name '*.py' | grep -q .; then exit 1; fi
  docker-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Execute native controller and worker Docker workflow
        env:
          RUN_DOCKER_INTEGRATION: '1'
        run: |
          docker pull python:3.12-slim
          go test -count=1 -timeout 240s -run '^TestDockerControllerWorker$' ./internal/controller
