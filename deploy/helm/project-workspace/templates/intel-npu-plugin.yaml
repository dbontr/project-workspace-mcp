{{- if .Values.hardware.intelNpu.enabled }}
{{- if empty .Values.hardware.intelNpu.nodeSelector }}
{{- fail "hardware.intelNpu.nodeSelector must select explicitly approved NPU worker nodes" }}
{{- end }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: intel-npu-plugin
  namespace: {{ .Values.hardware.namespace }}
  labels:
    app: intel-npu-plugin
spec:
  selector:
    matchLabels:
      app: intel-npu-plugin
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: intel-npu-plugin
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        {{- toYaml .Values.hardware.intelNpu.nodeSelector | nindent 8 }}
      containers:
        - name: intel-npu-plugin
          image: {{ .Values.hardware.intelNpu.image | quote }}
          imagePullPolicy: {{ .Values.hardware.intelNpu.imagePullPolicy }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 40m
              memory: 45Mi
            limits:
              cpu: 100m
              memory: 90Mi
          volumeMounts:
            - name: devfs
              mountPath: /dev/accel
              readOnly: true
            - name: sysfsaccel
              mountPath: /sys/class/accel
              readOnly: true
            - name: kubeletsockets
              mountPath: /var/lib/kubelet/device-plugins
      volumes:
        - name: devfs
          hostPath:
            path: /dev/accel
            type: Directory
        - name: sysfsaccel
          hostPath:
            path: /sys/class/accel
            type: Directory
        - name: kubeletsockets
          hostPath:
            path: /var/lib/kubelet/device-plugins
            type: Directory
{{- end }}
